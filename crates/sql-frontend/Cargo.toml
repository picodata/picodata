[package]
name = "sql-frontend"
version = "0.1.0"
rust-version.workspace = true
authors = ["Picodata"]
license-file.workspace = true
edition.workspace = true

[dependencies]
ahash = { workspace = true }
chrono = { workspace = true }
itertools = "0.10"
lazy_static = "1.4"
pest = "2.0"
pest_derive = "2.0"
smol_str = { workspace = true }
sql-ast-new-analyzer = { path = "../sql-ast-new-analyzer" }
sql-ast-new-nodes = { path = "../sql-ast-new-nodes" }
sql-ast-new-parser = { path = "../sql-ast-new-parser" }
sql-ir = { path = "../sql-ir" }
sql-type-system = { path = "../sql-type-system" }
sqlformat = { workspace = true }
tarantool = { workspace = true, features = ["extra_impls"] }
thiserror = { workspace = true }
time = { workspace = true, features = ["parsing", "formatting", "macros"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
insta = { workspace = true, features = ["yaml"] }
tarantool = { workspace = true, features = ["standalone_decimal", "extra_impls"] }

# Self-referential dev-dependency. Forces the `mock` feature on.
sql-frontend = { path = ".", features = ["mock"] }
sql-executor = { path = "../sql-executor", features = ["mock"] }

[features]
mock = ["sql-ir/mock"]
__bench_ast_new = []
