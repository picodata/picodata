[package]
name = "sql-ast-new-to-ir"
version = "0.1.0"
rust-version.workspace = true
authors = ["Picodata"]
license-file.workspace = true
edition.workspace = true

[dependencies]
smol_str = { workspace = true }
sql-ast-new-nodes = { path = "../sql-ast-new-nodes" }
sql-ir = { path = "../sql-ir" }

[dev-dependencies]
insta = { workspace = true, features = ["yaml"] }
pretty_assertions = { workspace = true }
regex = { workspace = true }
# Tests need analyzed raw query.
sql-frontend = { path = "../sql-frontend", features = ["mock"] }
# `MockCatalog` — the catalog builder the corpus crate registers its own schema
# on — is the `Metadata` implementation the snapshots are written against.
sql-ast-new-corpus = { path = "../sql-ast-new-corpus", features = ["mock"] }
