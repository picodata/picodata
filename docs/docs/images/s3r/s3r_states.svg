<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370">
<title>Состояния группы размещения</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
<marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#000000"/></marker>
</defs>
<rect x="0" y="0" width="680" height="370" fill="#ffffff"/>
<text x="12" y="24" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#000000">Группа размещения (s3r_pg.state)</text>
<circle cx="130" cy="52" r="7" fill="#000000"/>
<line x1="130" y1="59" x2="130" y2="101" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
<text x="120" y="74" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#222222">формирует</text>
<text x="120" y="89" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#222222">владелец</text>
<rect x="75.0" y="102" width="110" height="36" rx="18" fill="#58ffab" stroke="#2b2b2b" stroke-width="1"/>
<text x="130" y="125" font-family="'Liberation Mono', Menlo, monospace" font-size="14" font-weight="normal" text-anchor="middle" fill="#000000" font-style="italic">new</text>
<rect x="305.0" y="102" width="110" height="36" rx="18" fill="#58ffab" stroke="#2b2b2b" stroke-width="1"/>
<text x="360" y="125" font-family="'Liberation Mono', Menlo, monospace" font-size="14" font-weight="normal" text-anchor="middle" fill="#000000" font-style="italic">active</text>
<rect x="535.0" y="102" width="110" height="36" rx="18" fill="#58ffab" stroke="#2b2b2b" stroke-width="1"/>
<text x="590" y="125" font-family="'Liberation Mono', Menlo, monospace" font-size="14" font-weight="normal" text-anchor="middle" fill="#000000" font-style="italic">sealed</text>
<rect x="295.0" y="232" width="130" height="36" rx="18" fill="#58ffab" stroke="#2b2b2b" stroke-width="1"/>
<text x="360" y="255" font-family="'Liberation Mono', Menlo, monospace" font-size="14" font-weight="normal" text-anchor="middle" fill="#000000" font-style="italic">draining</text>
<line x1="186" y1="120" x2="304" y2="120" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
<text x="245" y="92" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222222">участники выделили</text>
<text x="245" y="107" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222222">первые экстенты</text>
<line x1="416" y1="120" x2="534" y2="120" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
<text x="475" y="77" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222222">предел размера</text>
<text x="475" y="92" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222222">или нет свободного</text>
<text x="475" y="107" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222222">экстента</text>
<path d="M 140 138 C 160 220, 230 250, 294 250" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
<text x="170" y="225" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#222222">формирование</text>
<text x="170" y="240" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#222222">отменено</text>
<path d="M 585 138 C 570 220, 500 250, 426 250" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
<text x="588" y="200" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#222222">объектов</text>
<text x="588" y="215" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#222222">не осталось</text>
<line x1="360" y1="268" x2="360" y2="327" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
<text x="348" y="296" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#222222">участники освободили</text>
<text x="348" y="311" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#222222">экстенты, строка удалена</text>
<circle cx="360" cy="340" r="12" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<circle cx="360" cy="340" r="7" fill="#000000"/>
<text x="380" y="345" font-family="'Liberation Mono', Menlo, monospace" font-size="14" font-weight="normal" text-anchor="start" fill="#000000" font-style="italic">end</text>
</svg>
