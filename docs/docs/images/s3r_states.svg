<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520">
<title>Состояния диска и группы размещения</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
<marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#000000"/></marker>
</defs>
<rect x="0" y="0" width="680" height="520" fill="#ffffff"/>
<text x="12" y="24" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#000000">Диск (s3r_disk.state)</text>
<rect x="30.0" y="72" width="120" height="36" rx="18" fill="#58ffab" stroke="#2b2b2b" stroke-width="1"/>
<text x="90" y="95" font-family="'Liberation Mono', Menlo, monospace" font-size="14" font-weight="normal" text-anchor="middle" fill="#000000" font-style="italic">opening</text>
<rect x="280.0" y="72" width="120" height="36" rx="18" fill="#58ffab" stroke="#2b2b2b" stroke-width="1"/>
<text x="340" y="95" font-family="'Liberation Mono', Menlo, monospace" font-size="14" font-weight="normal" text-anchor="middle" fill="#000000" font-style="italic">active</text>
<rect x="525.0" y="72" width="130" height="36" rx="18" fill="#58ffab" stroke="#2b2b2b" stroke-width="1"/>
<text x="590" y="95" font-family="'Liberation Mono', Menlo, monospace" font-size="14" font-weight="normal" text-anchor="middle" fill="#000000" font-style="italic">draining</text>
<rect x="280.0" y="178" width="120" height="36" rx="18" fill="#58ffab" stroke="#2b2b2b" stroke-width="1"/>
<text x="340" y="201" font-family="'Liberation Mono', Menlo, monospace" font-size="14" font-weight="normal" text-anchor="middle" fill="#000000" font-style="italic">lost</text>
<line x1="151" y1="90" x2="278" y2="90" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
<text x="214" y="62" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222222">хранилище</text>
<text x="214" y="77" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222222">открыто</text>
<path d="M 385 73 C 440 40, 500 40, 560 72" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
<text x="472" y="36" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222222">перевод в обслуживание</text>
<path d="M 556 108 C 500 138, 440 138, 392 108" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
<text x="472" y="146" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222222">отмена перевода</text>
<line x1="340" y1="109" x2="340" y2="176" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M 95 109 C 110 170, 220 196, 278 196" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M 590 109 C 580 170, 460 196, 402 196" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
<text x="340" y="232" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222222">инстанс исключён из кластера</text>
<text x="340" y="247" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222222">или оператор отметил отказ</text>
<line x1="8" y1="262" x2="672" y2="262" stroke="#c5c5c5" stroke-width="1"/>
<text x="12" y="290" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#000000">Группа размещения (s3r_pg.state)</text>
<rect x="40.0" y="402" width="120" height="36" rx="18" fill="#58ffab" stroke="#2b2b2b" stroke-width="1"/>
<text x="100" y="425" font-family="'Liberation Mono', Menlo, monospace" font-size="14" font-weight="normal" text-anchor="middle" fill="#000000" font-style="italic">clean</text>
<rect x="275.0" y="302" width="130" height="36" rx="18" fill="#58ffab" stroke="#2b2b2b" stroke-width="1"/>
<text x="340" y="325" font-family="'Liberation Mono', Menlo, monospace" font-size="14" font-weight="normal" text-anchor="middle" fill="#000000" font-style="italic">degraded</text>
<rect x="512.0" y="402" width="136" height="36" rx="18" fill="#58ffab" stroke="#2b2b2b" stroke-width="1"/>
<text x="580" y="425" font-family="'Liberation Mono', Menlo, monospace" font-size="14" font-weight="normal" text-anchor="middle" fill="#000000" font-style="italic">repairing</text>
<path d="M 120 402 C 150 340, 220 320, 274 320" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
<text x="96" y="360" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222222">участник</text>
<text x="96" y="375" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222222">утрачен</text>
<path d="M 406 320 C 480 320, 540 340, 572 401" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
<text x="560" y="318" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#222222">слот назначен</text>
<text x="560" y="333" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#222222">на новый диск</text>
<path d="M 540 404 C 500 380, 450 350, 392 338" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
<text x="430" y="376" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#222222">задание не выполнено</text>
<line x1="161" y1="426" x2="511" y2="426" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
<text x="336" y="446" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222222">перенос слота при выводе диска</text>
<path d="M 560 439 C 460 492, 220 492, 118 439" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
<text x="340" y="506" font-family="HelveticaNeueCyr, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222222">задания восстановления выполнены</text>
</svg>
